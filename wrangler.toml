# Cloudflare Workers deployment. `deno task build` writes both things this points at.
name = "task-tree"
main = "web/dist/worker.js"
compatibility_date = "2026-10-01"

# The chunks, `static/`, `sw.js` and the asset manifest. The platform answers requests for these
# before the Worker runs; the Worker reads the manifest through the binding.
[assets]
directory = "web/dist/public"
binding = "ASSETS"

# Account kuboon, APAC. Migrations: `deno task db migrate --remote` (needs CLOUDFLARE_*
# env, see README) — the journal table `data_table_migrations` is shared with the local runs.
[[d1_databases]]
binding = "DB"
database_name = "task-tree"
database_id = "6688e147-2742-49ca-a26a-93337fe6d4aa"

[vars]
IDP_ORIGIN = "https://id.kbn.one"
# This Worker's public origin; must be on the IdP's AUTHORIZE_WHITELIST.
RP_ORIGIN = "https://task-tree.kuboon.workers.dev"

# Secrets (`wrangler secret put <NAME>`), not here:
#   RP_SIGNING_KEY_JWK — a fixed ES256 private JWK; without it every isolate signs with its own key.
